<!DOCTYPE html>
<html>

<head>
    <title>Register - BlogHub</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

    <div class="form-container">

        <h2>Register</h2>

        <form id="registerForm">

            <input
                type="text"
                id="username"
                placeholder="Username (letters, numbers, _)"
                minlength="3"
                maxlength="30"
                pattern="[A-Za-z0-9_]+"
                title="3 to 30 characters: letters, numbers and underscores only"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password (at least 8 characters)"
                minlength="8"
                maxlength="128"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p id="registerMessage"></p>

    </div>

    <script src="/static/js/app.js"></script>

</body>

</html>
