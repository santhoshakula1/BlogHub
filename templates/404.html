<!DOCTYPE html>

<html>

<head>

    <title>Page not found - BlogHub</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            BlogHub
        </div>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

        </div>

    </nav>

    <main>

        <div class="form-container not-found">

            <p class="not-found-code">
                404
            </p>

            <h2>
                Page not found
            </h2>

            <p>
                The page you are looking for does not exist,
                or it may have been moved.
            </p>

            <a
                href="/"
                class="hero-button"
            >
                Back to Home
            </a>

        </div>

    </main>

    <script src="/static/js/app.js"></script>

</body>

</html>
