<!DOCTYPE html>

<html>

<head>

    <title>Login - BlogHub</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

    <div class="form-container">

        <h2>Login</h2>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

            <p id="loginMessage"></p>

        </form>

        <p>

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </p>

    </div>

    <script src="/static/js/app.js"></script>

</body>

</html>
