<!DOCTYPE html>

<html>

<head>

    <title>Profile - BlogHub</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            BlogHub
        </div>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/new-post">
                New Post
            </a>

            <button
                class="nav-button"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </nav>


    <div class="form-container">

        <h2>
            My Profile
        </h2>

        <p id="profileMessage"></p>

        <p>
            <strong>User ID:</strong>
            <span id="profileId">
                Loading...
            </span>
        </p>

        <p>
            <strong>Username:</strong>
            <span id="profileUsername">
                Loading...
            </span>
        </p>

        <p>
            <strong>Email:</strong>
            <span id="profileEmail">
                Loading...
            </span>
        </p>

        <p>
            <strong>Account Created:</strong>
            <span id="profileCreated">
                Loading...
            </span>
        </p>

    </div>


    <script src="/static/js/app.js"></script>

</body>

</html>
