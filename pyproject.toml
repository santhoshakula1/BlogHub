[project]
name = "blog-platform"
version = "0.1.0"
description = "BlogHub: a multi-user blog platform built with FastAPI, PostgreSQL and vanilla JavaScript"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.54",
]

